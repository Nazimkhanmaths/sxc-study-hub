<!DOCTYPE html>
<html lang="en">
<head> 
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-08WC99F9GQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-08WC99F9GQ');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SXC Study Hub - Secure Access</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config for SXC Theme -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sxc: {
                            navy: '#0F2C59',
                            navyLight: '#183b73',
                            navyDark: '#081a38',
                            gold: '#E5A93C',
                            goldHover: '#c88f28',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; transition: background-color 0.3s ease; }
        .dark body { background-color: #0b1329; color: #f1f5f9; }
        .sxc-gradient { background: linear-gradient(135deg, #081a38 0%, #0F2C59 60%, #1e427b 100%); }
        .gold-border { border-bottom: 3px solid #E5A93C; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        .dark ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        select optgroup { background: #f1f5f9; color: #0F2C59; font-weight: 800; }
        .dark select optgroup { background: #1e293b; color: #E5A93C; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center antialiased">

    <!-- ========================================== -->
    <!-- 1. THE LOGIN SCREEN (Google & Email)       -->
    <!-- ========================================== -->
    <div id="auth-container" class="bg-white p-8 rounded-lg shadow-md w-96 text-center mt-10">
        <h2 class="text-2xl font-bold mb-2 text-gray-800">SXC Study Hub</h2>
        <p class="text-sm text-gray-600 mb-6">Log in to access study materials.</p>
        
        <!-- Email & Password -->
        <input type="email" id="email" placeholder="Email address" class="w-full mb-3 p-2 border rounded text-slate-800">
        <input type="password" id="password" placeholder="Password" class="w-full mb-4 p-2 border rounded text-slate-800">

        <div class="text-right mb-4"><button id="forgot-btn" class="text-xs text-blue-600 hover:underline">Forgot Password?</button></div>

        <div class="flex gap-2 mb-4">
            <button id="login-btn" class="w-1/2 bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Log In</button>
            <button id="signup-btn" class="w-1/2 bg-gray-200 text-gray-800 font-bold py-2 rounded hover:bg-gray-300">Sign Up</button>
        </div>

        <div class="flex items-center my-4">
            <hr class="flex-grow border-gray-300">
            <span class="px-3 text-gray-500 text-sm">OR</span>
            <hr class="flex-grow border-gray-300">
        </div>

        <!-- Google Sign-In -->
        <button id="google-btn" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded mb-4 hover:bg-red-600 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/></svg>
            Sign in with Google
        </button>

        <p id="error-message" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>

    <!-- ========================================== -->
    <!-- 2. ST. XAVIER'S WEBSITE (Hidden by default)-->
    <!-- ========================================== -->
    <div id="protected-website" class="hidden w-full h-full">
        <!-- HEADER -->
        <header class="sxc-gradient text-white shadow-xl sticky top-0 z-30 gold-border">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3.5 gap-4">
                    
                    <div class="flex items-center space-x-3.5">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center p-1 shadow-md border-2 border-sxc-gold flex-shrink-0">
                            <i class="fa-solid fa-graduation-cap text-sxc-navy text-2xl"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="text-xl font-black tracking-tight leading-none">ST. XAVIER'S COLLEGE</h1>
                                <span class="bg-sxc-gold text-sxc-navy text-[10px] font-black px-1.5 py-0.5 rounded uppercase">MUMBAI</span>
                            </div>
                            <div class="flex items-center gap-2 mt-0.5">
                                <p class="text-xs text-amber-200/90 font-medium tracking-wide">Verified PYQs & Student Hub</p>
                                <span id="dbStatusBadge" class="bg-amber-500/20 text-amber-300 border border-amber-400/30 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Connecting DB...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Auth Options -->
                    <div class="flex items-center space-x-2.5 flex-wrap gap-y-2">
                        <div id="userProfileBadge" class="flex items-center space-x-2 bg-white/10 px-3 py-1.5 rounded-xl border border-white/20 text-xs">
                            <img id="userAvatar" src="https://placehold.co/40x40/0F2C59/E5A93C?text=U" alt="" class="w-6 h-6 rounded-full border border-sxc-gold">
                            <span id="userName" class="font-bold text-amber-200">Student</span>
                            <button id="logout-btn" class="text-slate-300 hover:text-white ml-2 text-[10px] uppercase font-bold underline cursor-pointer">Logout</button>
                        </div>

                        <button onclick="toggleDarkMode()" class="p-2.5 bg-white/10 hover:bg-white/20 text-amber-200 rounded-xl transition text-sm flex items-center justify-center cursor-pointer border border-white/10">
                            <i id="themeIcon" class="fa-solid fa-moon text-sxc-gold"></i>
                        </button>
                    </div>
                </div>

                <!-- NAVIGATION TABS -->
                <nav class="flex space-x-2 border-t border-white/10 pt-2 pb-1 overflow-x-auto text-xs sm:text-sm font-bold no-scrollbar">
                    <button id="tabBtnBrowse" onclick="switchTab('browse')" class="px-4 py-2 rounded-t-xl bg-white dark:bg-slate-900 text-sxc-navy dark:text-amber-300 flex items-center gap-2 cursor-pointer transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-layer-group"></i> <span>Browse Materials</span>
                        <span id="navCountBadge" class="bg-sxc-navy/10 text-sxc-navy dark:text-amber-300 font-black text-[10px] px-2 py-0.5 rounded-full">0</span>
                    </button>
                    <button id="tabBtnUpload" onclick="switchTab('upload')" class="px-4 py-2 rounded-t-xl text-slate-300 hover:text-white flex items-center gap-2 cursor-pointer transition whitespace-nowrap">
                        <i class="fa-solid fa-cloud-arrow-up"></i> <span>Student Upload</span>
                    </button>
                    <button id="tabBtnSuggestions" onclick="switchTab('suggestions')" class="px-4 py-2 rounded-t-xl text-slate-300 hover:text-white flex items-center gap-2 cursor-pointer transition whitespace-nowrap">
                        <i class="fa-solid fa-lightbulb text-sxc-gold"></i> <span>Ideas & Rating</span>
                    </button>
                    <button id="tabBtnAdmin" onclick="switchTab('admin')" class="px-4 py-2 rounded-t-xl text-slate-300 hover:text-white flex items-center gap-2 cursor-pointer transition whitespace-nowrap">
                        <i class="fa-solid fa-user-shield text-sxc-gold"></i> <span>Admin Portal</span>
                        <span id="pendingCountBadge" class="bg-red-500 text-white font-black text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
                    </button>
                </nav>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
            <!-- TAB 1: BROWSE VERIFIED MATERIALS -->
            <section id="viewBrowse" class="tab-view space-y-6 w-full">
                <!-- Filters -->
                <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 sm:p-6 transition-colors">
                    <div class="relative mb-4">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search by Subject, Course Code, Topic..." class="w-full pl-10 pr-10 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium outline-none text-slate-800 dark:text-slate-100">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <select id="departmentFilter" onchange="applyFilters()" class="w-full py-2.5 px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium outline-none text-slate-800 dark:text-slate-200">
                                <option value="ALL">All Departments & Programs</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Economics">Economics</option>
                            </select>
                        </div>
                        <div>
                            <select id="semesterFilter" onchange="applyFilters()" class="w-full py-2.5 px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium outline-none text-slate-800 dark:text-slate-200">
                                <option value="ALL">All Semesters / Years</option>
                                <option value="Sem 2">Semester 2</option>
                                <option value="Sem 3">Semester 3</option>
                            </select>
                        </div>
                        <div>
                            <select id="typeFilter" onchange="applyFilters()" class="w-full py-2.5 px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium outline-none text-slate-800 dark:text-slate-200">
                                <option value="ALL">All Types</option>
                                <option value="PYQ">End-Sem Question Papers (PYQ)</option>
                                <option value="Notes">Lecture Notes / Solved Answers</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="emptyState" class="hidden text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-800">
                    <i class="fa-solid fa-folder-open text-5xl text-slate-300 dark:text-slate-700 mb-3"></i>
                    <h3 class="font-bold text-slate-700 dark:text-slate-200 text-lg">No verified materials found</h3>
                </div>

                <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <!-- TAB 2: DIRECT STUDENT UPLOAD -->
            <section id="viewUpload" class="tab-view hidden max-w-2xl mx-auto">
                <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                    <div class="sxc-gradient p-6 text-white gold-border">
                        <h2 class="text-xl font-black flex items-center gap-2">
                            <i class="fa-solid fa-file-arrow-up text-sxc-gold"></i> Open Student Contribution
                        </h2>
                    </div>
                    <form id="studentUploadForm" onsubmit="handleStudentUploadSubmit(event)" class="p-6 space-y-4">
                        <input type="text" id="studUpTitle" required placeholder="Document Title" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-sm outline-none text-slate-800 dark:text-slate-100">
                        <input type="url" id="studUpUrl" required placeholder="Google Drive URL" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-sm outline-none text-slate-800 dark:text-slate-100">
                        <button type="submit" class="w-full py-3 bg-sxc-navy hover:bg-sxc-navyLight text-white font-extrabold rounded-xl shadow-lg transition">Submit Material</button>
                    </form>
                </div>
            </section>

            <!-- TAB 3: IDEAS & RATINGS -->
            <section id="viewSuggestions" class="tab-view hidden max-w-4xl mx-auto space-y-6">
                <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-6">
                    <h2 class="text-xl font-black text-slate-800 dark:text-slate-100 mb-4">Portal Feedback</h2>
                    <form onsubmit="handleSuggestionSubmit(event)" class="space-y-4">
                        <textarea id="sugText" required rows="3" placeholder="What features or notes do you need?" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-sm outline-none text-slate-800 dark:text-slate-100"></textarea>
                        <button type="submit" class="px-5 py-2.5 bg-sxc-navy text-white font-extrabold rounded-xl text-xs">Submit Idea</button>
                    </form>
                    <div id="suggestionsList" class="mt-6 space-y-4"></div>
                </div>
            </section>

            <!-- TAB 4: ADMIN DASHBOARD -->
            <section id="viewAdmin" class="tab-view hidden max-w-5xl mx-auto space-y-6">
                <div id="adminLoginGate" class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-2xl p-8 text-center mt-10 shadow-xl border">
                    <h2 class="text-xl font-black text-slate-800 dark:text-slate-100 mb-4">Admin Dashboard</h2>
                    <form onsubmit="verifyAdmin(event)">
                        <input type="password" id="adminPasscode" placeholder="Enter PIN" class="w-full text-center px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl mb-4 text-slate-800 dark:text-slate-100">
                        <button type="submit" class="w-full py-3 bg-sxc-navy text-white font-extrabold rounded-xl shadow-lg">Unlock Dashboard</button>
                    </form>
                </div>
                <div id="adminDashboard" class="hidden space-y-8">
                    <!-- Dashboard tables generated via script -->
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl"><h3 class="font-black text-slate-800 dark:text-white mb-4">Manage Pending</h3><table class="w-full"><tbody id="pendingTableList"></tbody></table></div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl"><h3 class="font-black text-slate-800 dark:text-white mb-4">Manage Live Database</h3><table class="w-full"><tbody id="adminDataList"></tbody></table></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-sxc-navy text-white px-5 py-3 rounded-xl shadow-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-3 border-l-4 border-sxc-gold">
        <i class="fa-solid fa-circle-check text-sxc-gold text-lg"></i>
        <span id="toastMsg" class="text-sm font-semibold">Message</span>
    </div>

    <!-- ========================================== -->
    <!-- 3. UNIFIED FIREBASE & LOGIC SCRIPT         -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
       import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
            GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDK0c-wCRI8F4sA_4kSCu8G6l67LEPpCYI",
            authDomain: "sxc-mumbai-portal.firebaseapp.com",
            projectId: "sxc-mumbai-portal",
            storageBucket: "sxc-mumbai-portal.firebasestorage.app",
            messagingSenderId: "1070155779544",
            appId: "1:1070155779544:web:e9b55883f81689b8ee76ad"
        };

        // Initialize Firebase ONLY ONCE
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.sxcDB = getFirestore(app);
        window.useCloudDB = true;

        // UI Auth Elements
        const authContainer = document.getElementById('auth-container');
        const protectedWebsite = document.getElementById('protected-website');
        const errorText = document.getElementById('error-message');

        const showError = (msg) => { errorText.textContent = msg; errorText.classList.remove('hidden'); };
        
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // Global DB Variables
        let resources = JSON.parse(localStorage.getItem('sxc_res')) || [
            { id: 'res-init-1', title: 'Sem 3 Data Structures End-Sem PYQ (2023)', department: 'Information Technology', semester: 'Sem 3', subject: 'Data Structures', type: 'PYQ', fileUrl: 'https://drive.google.com/', contributor: 'Faculty Admin', date: '2025-10-12' },
            { id: 'res-init-2', title: 'Macroeconomics Unit 1-4 Notes & Solved Papers', department: 'Economics', semester: 'Sem 2', subject: 'Economics', type: 'Notes', fileUrl: 'https://drive.google.com/', contributor: 'Topper Batch', date: '2025-10-15' }
        ];
        let pendingResources = JSON.parse(localStorage.getItem('sxc_pend')) || [];
        let suggestions = JSON.parse(localStorage.getItem('sxc_sug')) || [];
        let currentUser = null;

        function saveDataLocally() {
            localStorage.setItem('sxc_res', JSON.stringify(resources));
            localStorage.setItem('sxc_pend', JSON.stringify(pendingResources));
            localStorage.setItem('sxc_sug', JSON.stringify(suggestions));
        }

        // 1. Authentication State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authContainer.classList.add('hidden');
                protectedWebsite.classList.remove('hidden');
                document.body.classList.remove('items-center', 'justify-center');
                
                // Display Name
                const displayName = user.displayName || user.email || "Student";
                document.getElementById('userName').innerText = displayName;
                
                // Load data after successful login
                loadDataFromCloud();
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                protectedWebsite.classList.add('hidden');
                document.body.classList.add('items-center', 'justify-center');
            }
        });

        // Auth Listeners
        document.getElementById('signup-btn').addEventListener('click', () => {
            createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(error => showError(error.message));
        });
        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(error => showError(error.message));
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        document.getElementById('google-btn').addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(error => showError(error.message));
        });

        // Forgot Password Logic
        document.getElementById('forgot-btn').addEventListener('click', () => {
            const emailValue = document.getElementById('email').value;
            if (!emailValue) {
                showError("Please enter your email address first.");
                return;
            }
            sendPasswordResetEmail(auth, emailValue)
                .then(() => {
                    window.showToast("Password reset email sent!");
                    errorText.classList.add('hidden');
                })
                .catch(error => showError(error.message));
        });

        // 2. Database & UI Logic (Wrapped in functions)
        async function loadDataFromCloud() {
            if (window.useCloudDB && window.sxcDB) {
                try {
                    const resSnap = await getDocs(collection(window.sxcDB, "resources"));
                    if (!resSnap.empty) {
                        resources = []; // This line permanently stops the duplication
                        resSnap.forEach(d => {
                            resources.push({ id: d.id, ...d.data() });
                        });
                    }
                    saveDataLocally();
                } catch (e) { console.warn("Cloud DB skipped, using local", e); }
            }
            renderResources();
            renderSuggestions();
        }

        // Exposing portal functions to window for inline onclick HTML handlers
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
            document.getElementById('view' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
        }

        window.toggleDarkMode = function() { document.documentElement.classList.toggle('dark'); }
        window.applyFilters = function() { renderResources(); }
        
        window.renderResources = function() {
            const grid = document.getElementById('resourceGrid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = resources.filter(r => r.title.toLowerCase().includes(term));
            document.getElementById('navCountBadge').innerText = filtered.length;
            
            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                grid.innerHTML = ''; return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            
            grid.innerHTML = filtered.map(item => `
                <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">${item.type}</span>
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base mt-2">${item.title}</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${item.department} • ${item.semester}</p>
                    <a href="${item.fileUrl}" target="_blank" class="mt-4 flex items-center justify-center gap-2 w-full px-3 py-2 bg-sxc-navy text-white text-xs font-bold rounded-lg transition">View Material</a>
                </div>
            `).join('');
        }

        // Admin & Form Submissions
        window.verifyAdmin = function(e) {
            e.preventDefault();
            if (document.getElementById('adminPasscode').value === 'Nasxczim9899') {
                document.getElementById('adminLoginGate').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                window.showToast("Admin Unlocked");
            }
        }
        
        window.handleSuggestionSubmit = function(e) { e.preventDefault(); window.showToast("Feedback sent!"); }
        window.handleStudentUploadSubmit = function(e) { e.preventDefault(); window.showToast("Material Submitted!"); }
    </script>
</body>
</html>
